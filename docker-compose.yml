services:        
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genai-splitter
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

    ports:
      - "8088:8000"
    env_file:
      - .env
    
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 0.5G
